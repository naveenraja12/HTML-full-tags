<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN Forex Finder</title>
    
    <style>
        /* Basic reset for cleaner look */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(135deg, #0d6efd, #4facfe);
            color: white;
            padding: 80px 30px;
        }

        .hero-content {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .hero-text p {
            font-size: 20px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .hero-btn {
            background: white;
            color: #0d6efd;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .hero-image {
            flex: 1;
            text-align: center;
        }

        .hero-image img {
            width: 100%;
            max-width: 450px;
        }

        /* MOBILE */
        @media(max-width: 768px) {
            .hero-content {
                flex-direction: column;
                text-align: center; /* Optional: centers text on mobile */
            }

            .hero-text h1 {
                font-size: 38px;
            }

            .hero-text p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1>TN Forex Finder</h1>
                <p>
                    Find trusted Forex Exchange Shops across Tamil Nadu.
                    Check locations, timings, contact details and available currencies instantly.
                </p>
                <a href="index.html" class="hero-btn">
                    Explore Districts
                </a>
            </div>

            <div class="hero-image">
                <img src="forex.png.jpeg" alt="TN Forex Finder">
            </div>
        </div>
    </section>

    <script>
        console.log("TN Forex Finder Loaded");
    </script>

</body>
</html>
